<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz de Notas de Guitarra</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #23272a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #f1c40f;
            margin-bottom: 10px;
            text-align: center;
        }
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            margin-bottom: 30px;
        }
        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 15px;
        }
        .stats {
            font-size: 1.2em;
            background: #2c2f33;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            gap: 15px;
        }
        .main-container {
            display: flex;
            flex-direction: row;
            gap: 40px;
            align-items: flex-start;
            justify-content: center;
            max-width: 1000px;
            width: 100%;
            flex-wrap: wrap;
        }
        .fretboard-wrapper {
            display: flex;
            flex-direction: row;
            background: #4a2f1d;
            padding: 20px 20px 20px 10px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            width: fit-content;
            box-sizing: border-box;
        }
        .fret-markers-vertical {
            display: flex;
            flex-direction: column;
            width: 40px;
            margin-right: 5px;
            flex-shrink: 0;
        }
        .fret-number-v {
            height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #d4c4a8;
            font-size: 1.1em;
            box-sizing: border-box;
        }
        .fret-number-v:first-child {
            height: 35px;
            font-size: 0.9em;
            color: #888;
        }
        .fretboard {
            display: flex;
            flex-direction: row;
            position: relative;
            background: #3e2617;
            border: 2px solid #2c1a0e;
            border-radius: 4px;
            flex: 1;
        }
        .string-container {
            display: flex;
            flex-direction: column;
            flex: 1; 
            min-width: 35px; 
            position: relative;
        }
        .fret {
            height: 55px; 
            border-bottom: 3px solid #b3b3b3;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
        .fret:first-child {
            height: 35px;
            border-bottom: 8px solid #d4c4a8; 
            background: #2a1910;
        }
        .fret:last-child {
            border-bottom: none;
        }
        .string-line {
            position: absolute;
            top: 0; bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            background: #e8e8e8;
            z-index: 1;
            box-shadow: 2px 0 5px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        .target {
            width: 26px;
            height: 26px;
            background: #e74c3c;
            border: 3px solid #ffffff;
            border-radius: 50%;
            z-index: 3;
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulse 1.5s infinite;
        }
        .inlay {
            position: absolute;
            width: 18px;
            height: 18px;
            background: #d4c4a8;
            border-radius: 50%;
            z-index: 0;
            top: 50%;
            left: 100%;
            transform: translate(-50%, -50%);
            opacity: 0.9;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.4);
            pointer-events: none;
        }
        
        .options-container {
            flex: 1;
            max-width: 450px;
            min-width: 300px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            background: #2c2f33;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            align-self: flex-start;
        }
        .note-btn {
            background: #7289da;
            color: white;
            border: none;
            padding: 20px 10px;
            font-size: 1.3em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #5b6eae;
        }
        .note-btn:hover {
            background: #677bc4;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #4a5c96;
        }
        .note-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        .note-btn.correct {
            background: #43b581 !important;
            box-shadow: 0 4px 0 #2b8259 !important;
        }
        .note-btn.wrong {
            background: #f04747 !important;
            box-shadow: 0 4px 0 #b33333 !important;
            animation: shake 0.4s;
        }
        
        select {
            padding: 10px 15px;
            font-size: 1.1em;
            border-radius: 8px;
            background: #ffffff;
            color: #333;
            border: 2px solid #7289da;
            cursor: pointer;
            outline: none;
            font-weight: bold;
            width: 100%;
            box-sizing: border-box;
        }

        .settings-btn {
            background: #4f545c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
            box-sizing: border-box;
        }
        .settings-btn:hover { background: #686d76; }

        /* Modal Styles */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 100; 
            left: 0; top: 0; 
            width: 100%; height: 100%; 
            background-color: rgba(0,0,0,0.8); 
            justify-content: center; 
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
        }
        .modal-content {
            background-color: #2c2f33;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.8);
            color: #fff;
            box-sizing: border-box;
        }
        .modal-content h2 { margin-top: 0; color: #f1c40f; text-align: center;}
        .setting-group {
            margin-bottom: 25px;
        }
        .setting-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 1.1em;
        }
        .fret-range {
            display: flex;
            align-items: center;
            gap: 15px;
            justify-content: center;
        }
        .fret-range input {
            width: 70px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #7289da;
            background: #fff;
            color: #333;
            font-size: 1.2em;
            text-align: center;
            font-weight: bold;
        }
        .save-btn {
            background: #43b581;
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1em;
            width: 100%;
            margin-bottom: 10px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .save-btn:hover { background: #329065; }
        .close-btn {
            background: #f04747;
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1em;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        .close-btn:hover { background: #c63333; }
        
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(231,76,60,0.7); }
            70% { box-shadow: 0 0 0 15px rgba(231,76,60,0); }
            100% { box-shadow: 0 0 0 0 rgba(231,76,60,0); }
        }

        /* 📱 RESPONSIVE MOBILE */
        @media (max-width: 768px) {
            body {
                padding: 10px;
                padding-bottom: 0;
            }
            .header h1 {
                font-size: 1.6em;
            }
            .header {
                margin-bottom: 10px;
            }
            .controls {
                flex-direction: column;
                width: 100%;
                gap: 10px;
            }
            .controls > * {
                width: 100%;
            }
            .stats {
                justify-content: space-around;
            }
            .main-container {
                flex-direction: column;
                align-items: center;
                gap: 20px;
                padding-bottom: 20px;
            }
            
            /* Ajuste fluido del mástil */
            .fretboard-wrapper {
                padding: 15px 10px 15px 5px;
                width: 100%;
                max-width: 400px;
            }
            .string-container {
                min-width: 0; 
            }
            .fret-number-v {
                font-size: 1em;
            }
            
            /* Panel de opciones sticky abajo */
            .options-container {
                position: sticky;
                bottom: 0;
                z-index: 50;
                grid-template-columns: repeat(4, 1fr);
                gap: 8px;
                padding: 15px;
                border-radius: 15px 15px 0 0;
                box-sizing: border-box;
                width: calc(100% + 20px);
                margin: 0 -10px;
                box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
            }
            .note-btn {
                padding: 12px 5px;
                font-size: 1.1em;
                box-shadow: 0 3px 0 #5b6eae;
            }
            .note-btn:active {
                transform: translateY(3px);
                box-shadow: none;
            }
            
            /* Modal ajustes responsive */
            .modal-content {
                padding: 20px;
            }
            .fret-range input {
                width: 55px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎸 Quiz de Notas de Guitarra</h1>
        <div class="controls">
            <select id="notation-select">
                <option value="english">Notación Inglesa (A B C)</option>
                <option value="solfege">Notación Latina (Do Re Mi)</option>
            </select>
            <button class="settings-btn" onclick="openSettings()">⚙️ Ajustes</button>
            <div class="stats">
                <span>✅ Aciertos: <strong id="score" style="color:#43b581;">0</strong></span>
                <span>❌ Errores: <strong id="errors" style="color:#f04747;">0</strong></span>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="fretboard-wrapper">
            <div id="fret-markers" class="fret-markers-vertical">
                <!-- Se genera dinámicamente -->
            </div>
            <div id="fretboard" class="fretboard">
                <!-- Se genera dinámicamente -->
            </div>
        </div>

        <div id="options-container" class="options-container">
            <!-- Botones de notas generados con JS -->
        </div>
    </div>

    <!-- Modal de Configuración -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h2>⚙️ Configuración</h2>
            
            <div class="setting-group">
                <label>Rango de Trastes Activos:</label>
                <div class="fret-range">
                    <input type="number" id="min-fret" min="0" max="12" value="0">
                    <span> a </span>
                    <input type="number" id="max-fret" min="0" max="12" value="12">
                </div>
            </div>
            
            <div class="setting-group">
                <label>Alteraciones (Teclas negras):</label>
                <select id="accidentals-select">
                    <option value="sharp">Solo Sostenidos (#)</option>
                    <option value="flat">Solo Bemoles (b)</option>
                    <option value="random">Aleatorio (# y b)</option>
                </select>
            </div>
            
            <button class="save-btn" onclick="saveSettings()">Guardar y Reiniciar</button>
            <button class="close-btn" onclick="closeSettings()">Cancelar</button>
        </div>
    </div>

    <script>
        const notesConfig = {
            english: {
                sharp: ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'],
                flat: ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B']
            },
            solfege: {
                sharp: ['Do', 'Do#', 'Re', 'Re#', 'Mi', 'Fa', 'Fa#', 'Sol', 'Sol#', 'La', 'La#', 'Si'],
                flat: ['Do', 'Reb', 'Re', 'Mib', 'Mi', 'Fa', 'Solb', 'Sol', 'Lab', 'La', 'Sib', 'Si']
            }
        };

        const openStrings = [4, 9, 2, 7, 11, 4]; 
        const stringThicknesses = [5.5, 4.5, 3.5, 2.5, 2, 1.5];

        let currentNotation = 'english';
        let accidentalsMode = 'sharp';
        let minFret = 0;
        let maxFret = 12;

        let currentTargetIndex = -1;
        let currentString = -1;
        let currentFret = -1;
        
        let score = 0;
        let errors = 0;
        let isAnimating = false;

        function init() {
            createFretboard();
            createNoteButtons();
            updateNotation();
            
            document.getElementById('notation-select').addEventListener('change', (e) => {
                currentNotation = e.target.value;
                updateNotation();
            });
            
            updateFretVisibility();
            startRound();
        }

        function createFretboard() {
            const fb = document.getElementById('fretboard');
            fb.innerHTML = '';
            
            for (let s = 0; s < 6; s++) {
                const col = document.createElement('div');
                col.className = 'string-container';
                
                const line = document.createElement('div');
                line.className = 'string-line';
                line.style.width = stringThicknesses[s] + 'px';
                col.appendChild(line);
                
                for (let f = 0; f <= 12; f++) {
                    const fret = document.createElement('div');
                    fret.className = 'fret';
                    fret.id = `fret-el-${s}-${f}`;
                    fret.style.transition = 'opacity 0.3s';
                    
                    if (s === 2 && [3, 5, 7, 9].includes(f)) {
                        const inlay = document.createElement('div');
                        inlay.className = 'inlay';
                        fret.appendChild(inlay);
                    }
                    if (f === 12) {
                        if (s === 1 || s === 3) {
                            const inlay = document.createElement('div');
                            inlay.className = 'inlay';
                            fret.appendChild(inlay);
                        }
                    }

                    const target = document.createElement('div');
                    target.className = 'target';
                    target.id = `target-${s}-${f}`;
                    fret.appendChild(target);
                    
                    col.appendChild(fret);
                }
                fb.appendChild(col);
            }
            
            const markers = document.getElementById('fret-markers');
            markers.innerHTML = '';
            for (let f = 0; f <= 12; f++) {
                const num = document.createElement('div');
                num.className = 'fret-number-v';
                num.id = `fret-marker-${f}`;
                num.textContent = f === 0 ? 'Aire' : f;
                num.style.transition = 'opacity 0.3s';
                markers.appendChild(num);
            }
        }

        function createNoteButtons() {
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            for (let i = 0; i < 12; i++) {
                const btn = document.createElement('button');
                btn.className = 'note-btn';
                btn.id = `btn-${i}`;
                btn.onclick = () => handleGuess(i);
                container.appendChild(btn);
            }
        }

        function updateNotation() {
            const sharps = notesConfig[currentNotation].sharp;
            const flats = notesConfig[currentNotation].flat;
            
            for (let i = 0; i < 12; i++) {
                let label = '';
                if (accidentalsMode === 'sharp') {
                    label = sharps[i];
                } else if (accidentalsMode === 'flat') {
                    label = flats[i];
                } else {
                    label = Math.random() > 0.5 ? sharps[i] : flats[i];
                }
                document.getElementById(`btn-${i}`).textContent = label;
            }
        }

        function updateFretVisibility() {
            for (let s = 0; s < 6; s++) {
                for (let f = 0; f <= 12; f++) {
                    const fretEl = document.getElementById(`fret-el-${s}-${f}`);
                    if (fretEl) {
                        fretEl.style.opacity = (f >= minFret && f <= maxFret) ? '1' : '0.2';
                    }
                }
            }
            for (let f = 0; f <= 12; f++) {
                const markerEl = document.getElementById(`fret-marker-${f}`);
                if (markerEl) {
                    markerEl.style.opacity = (f >= minFret && f <= maxFret) ? '1' : '0.2';
                }
            }
        }

        function startRound() {
            if (currentString !== -1 && currentFret !== -1) {
                document.getElementById(`target-${currentString}-${currentFret}`).style.display = 'none';
            }
            
            currentString = Math.floor(Math.random() * 6);
            
            const range = maxFret - minFret + 1;
            currentFret = Math.floor(Math.random() * range) + minFret;
            
            const targetEl = document.getElementById(`target-${currentString}-${currentFret}`);
            targetEl.style.display = 'block';
            
            // Efecto de Auto-Scroll suave en dispositivos móviles si queda fuera de pantalla
            setTimeout(() => {
                targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
            
            currentTargetIndex = (openStrings[currentString] + currentFret) % 12;

            if (accidentalsMode === 'random') {
                updateNotation();
            }
        }

        function handleGuess(noteIndex) {
            if (isAnimating) return;
            
            const btn = document.getElementById(`btn-${noteIndex}`);
            
            if (noteIndex === currentTargetIndex) {
                isAnimating = true;
                btn.classList.add('correct');
                score++;
                updateStats();
                
                setTimeout(() => {
                    btn.classList.remove('correct');
                    startRound();
                    isAnimating = false;
                }, 600);
            } else {
                btn.classList.add('wrong');
                errors++;
                updateStats();
                
                setTimeout(() => {
                    btn.classList.remove('wrong');
                }, 400);
            }
        }

        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('errors').textContent = errors;
        }

        function openSettings() {
            document.getElementById('min-fret').value = minFret;
            document.getElementById('max-fret').value = maxFret;
            document.getElementById('accidentals-select').value = accidentalsMode;
            document.getElementById('settings-modal').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settings-modal').style.display = 'none';
        }

        function saveSettings() {
            let newMin = parseInt(document.getElementById('min-fret').value);
            let newMax = parseInt(document.getElementById('max-fret').value);
            
            if (isNaN(newMin)) newMin = 0;
            if (isNaN(newMax)) newMax = 12;
            
            if (newMin < 0) newMin = 0;
            if (newMax > 12) newMax = 12;
            if (newMin > newMax) {
                const temp = newMin;
                newMin = newMax;
                newMax = temp;
            }
            
            minFret = newMin;
            maxFret = newMax;
            accidentalsMode = document.getElementById('accidentals-select').value;
            
            updateFretVisibility();
            updateNotation();
            
            score = 0;
            errors = 0;
            updateStats();
            
            closeSettings();
            startRound();
        }

        window.onload = init;
    </script>
</body>
</html>
